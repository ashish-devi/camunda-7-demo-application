apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: camunda7
  namespace: camunda7
  labels:
    release: metrics   # must match Prometheus serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app: camunda7
  endpoints:
    - port: http
      path: /camunda7/actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
