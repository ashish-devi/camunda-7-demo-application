apiVersion: apps/v1
kind: Deployment
metadata:
  name: camunda7
  namespace: camunda7
  labels:
    app: camunda7
    version: "7.21"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: camunda7
  strategy:
    type: Recreate
    # rollingUpdate:
    #   maxSurge: 1
    #   maxUnavailable: 0
  template:
    metadata:
      labels:
        app: camunda7
        version: "7.21"
      annotations:
        prometheus.io/scrape: "false"
    spec:
      # Restart pods when configmap changes (checksum-based rollout)
      # kubectl rollout restart deployment/camunda7 -n camunda7
      terminationGracePeriodSeconds: 60
      containers:
        - name: camunda7
          image: ghcr.io/ashish-devi/camunda-7-demo-application/camunda-7-demo-application:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: camunda7-db-secret
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: camunda7-db-secret
                  key: db-password
            - name: CAMUNDA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: camunda7-db-secret
                  key: camunda-admin-password
            - name: APP_WORKER_ENABLED
              value: "false"
            - name: APP_ENGINE_AUTO_START_ENABLED
              value: "true"
            - name: JAVA_OPTS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=200
                -XX:G1HeapRegionSize=16m
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/tmp
          volumeMounts:
            - name: app-config
              mountPath: /app/config/application.yaml
              subPath: application.yaml
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 500Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12   # 20 + 12*10 = 140s max startup time
            timeoutSeconds: 5
      volumes:
        - name: app-config
          configMap:
            name: camunda7-config
